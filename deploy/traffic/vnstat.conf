# Приватный независимый учёт общего внешнего трафика VPS.
DatabaseDir "/var/lib/codex-zai-traffic"
Interface "eth1"
InterfaceMatchMethod 0
AlwaysAddNewInterfaces 0
RescanDatabaseOnSave 1
UpdateInterval 5
PollInterval 5
SaveInterval 1
SaveOnStatusChange 1
OfflineSaveInterval 1
64bitInterfaceCounters 1
BandwidthDetection 0
MaxBandwidth 0
UseUTC 0
MonthRotate 1
UnitMode 2
Locale "C"
EstimateVisible 0
UseLogging 0
5MinuteHours 72
HourlyDays 60
DailyDays 366
MonthlyMonths 24
YearlyYears 2
